# TreeChat 站点配置（Nginx + PM2 部署）
#
# 用法：
#   1. 把本文件放到 /etc/nginx/sites-available/treechat.conf
#   2. ln -s /etc/nginx/sites-available/treechat.conf /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx
#
# 注意：
#   - server_name 改成你的域名或服务器公网 IP
#   - root 改成服务器上 dist 目录的实际绝对路径
#   - 前端 API 全部走相对路径 /api，由本配置反代到后端 3001

server {
    listen 80;
    server_name your-domain.com;   # ← 改成你的域名或服务器 IP

    # 前端静态文件（改成服务器上 dist 的实际绝对路径）
    root /var/www/treechat/dist;
    index index.html;

    # 带 hash 的静态资源：长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 后端 API + SSE 流式接口（/api/chat/stream）
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式必须关闭代理缓冲，否则 token 会被攒批才下发
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA fallback：未命中静态文件时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
